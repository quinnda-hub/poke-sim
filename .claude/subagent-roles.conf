# Model and reasoning effort for each subagent role.
#
# install.sh copies this file to <project>/.claude/subagent-roles.conf on first
# install, and later appends any role added to the kit since. Edit the
# project's copy to tune that project, then re-run install.sh to regenerate
# the agent frontmatter.
#
# model:  haiku | sonnet | opus | fable | inherit | a full model ID
# effort: low | medium | high | xhigh | max | -   ("-" omits the field)
#
# role         model    effort
scoper         haiku    medium
researcher     opus     medium
implementer    sonnet   medium
reviewer       opus     medium
shipper        haiku    low
